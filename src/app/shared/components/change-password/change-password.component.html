<div class="cp">
  <!-- Encabezado: solo cuando es una página (en el modal lo pone el modal) -->
  <div class="cp-head">
    <span class="cp-head-icon" aria-hidden="true">
      <svg viewBox="0 0 16 16"><use xlink:href="./assets/icons/bootstrap-icons.svg#shield-lock"></use></svg>
    </span>
    <div>
      <h1 class="cp-title">{{ 'cp.title' | translate }}</h1>
      <p class="cp-subtitle">{{ 'cp.subtitle' | translate }}</p>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="cp-form">
    <div class="cp-field">
      <label for="oldPassword" class="form-label">{{ 'cp.current' | translate }}</label>
      <div class="cp-input">
        <input [type]="show.old ? 'text' : 'password'" id="oldPassword" formControlName="oldPassword" class="form-control" autocomplete="current-password" required />
        <button type="button" class="cp-eye" (click)="show.old = !show.old" [attr.aria-label]="(show.old ? 'cp.hide' : 'cp.show') | translate">
          <svg viewBox="0 0 16 16" aria-hidden="true"><use [attr.xlink:href]="'./assets/icons/bootstrap-icons.svg#' + (show.old ? 'eye-slash' : 'eye')"></use></svg>
        </button>
      </div>
    </div>

    <div class="cp-field">
      <label for="newPassword" class="form-label">{{ 'cp.new' | translate }}</label>
      <div class="cp-input">
        <input [type]="show.new ? 'text' : 'password'" id="newPassword" formControlName="newPassword" class="form-control" autocomplete="new-password" required />
        <button type="button" class="cp-eye" (click)="show.new = !show.new" [attr.aria-label]="(show.new ? 'cp.hide' : 'cp.show') | translate">
          <svg viewBox="0 0 16 16" aria-hidden="true"><use [attr.xlink:href]="'./assets/icons/bootstrap-icons.svg#' + (show.new ? 'eye-slash' : 'eye')"></use></svg>
        </button>
      </div>
      <div class="cp-meter" *ngIf="form.get('newPassword')?.value" aria-hidden="true">
        <span [style.width.%]="strength * 25" [attr.data-level]="strength"></span>
      </div>
      <small class="cp-hint" *ngIf="form.get('newPassword')?.value">{{ strengthLabel }}</small>
    </div>

    <div class="cp-field">
      <label for="repeatPassword" class="form-label">{{ 'cp.repeat' | translate }}</label>
      <div class="cp-input">
        <input [type]="show.repeat ? 'text' : 'password'" id="repeatPassword" formControlName="repeatPassword" class="form-control" autocomplete="new-password" required
               [class.is-invalid]="mismatch" />
        <button type="button" class="cp-eye" (click)="show.repeat = !show.repeat" [attr.aria-label]="(show.repeat ? 'cp.hide' : 'cp.show') | translate">
          <svg viewBox="0 0 16 16" aria-hidden="true"><use [attr.xlink:href]="'./assets/icons/bootstrap-icons.svg#' + (show.repeat ? 'eye-slash' : 'eye')"></use></svg>
        </button>
      </div>
      <small class="cp-error" *ngIf="mismatch">{{ 'cp.mismatch' | translate }}</small>
    </div>

    <div class="cp-actions">
      <button id="cancelBtn" type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" (click)="cancel()">{{ 'cp.cancel' | translate }}</button>
      <button id="sendBtn" type="submit" class="btn btn-primary" data-bs-dismiss="modal"
              [disabled]="form.invalid || form.get('repeatPassword')?.value !== form.get('newPassword')?.value">
        <svg viewBox="0 0 16 16" aria-hidden="true"><use xlink:href="./assets/icons/bootstrap-icons.svg#check2"></use></svg>
        {{ 'cp.save' | translate }}
      </button>
    </div>
  </form>
</div>
